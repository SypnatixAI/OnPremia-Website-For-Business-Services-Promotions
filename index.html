<!doctype html>
<html lang="fr-CA">
  <head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
    <!-- Document title and encoding are emitted per-locale by SeoHead. -->

    <!--
      Scroll-reveal sections are prerendered at opacity:0 and revealed by JS.
      Without this, a disabled or failed bundle leaves the page blank below
      the fold. The hero uses CSS animation and is unaffected either way.
    -->
    <noscript>
      <style>
        [style*="opacity"] {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
